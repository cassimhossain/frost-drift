<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Frost Drift</title>
<link rel="icon" href="data:,">
<style>
  :root { --ice: #8fd3ff; --pine: #1f4d3a; --accent: #ff8a2b; --ink: #060b14; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* In-run display */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px; pointer-events: none; font-weight: 700;
  }
  .pill {
    background: rgba(6, 11, 20, .55); border: 1px solid rgba(143, 211, 255, .28); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 6px 14px; font-size: 15px;
    font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ice);
  }
  .pill b { color: #fff; }
  .pill.hot b { color: var(--accent); }
  .spacer { flex: 1; }
  #speed {
    position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); pointer-events: none;
    font-weight: 800; font-style: italic; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .7); text-align: right;
  }
  #speed small { display: block; font-size: 12px; font-style: normal; letter-spacing: .2em; color: var(--ice); }
  #banner {
    position: fixed; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; opacity: 0;
    font-weight: 800; font-style: italic; font-size: clamp(24px, 5vw, 46px); letter-spacing: .04em;
    text-shadow: 0 2px 22px rgba(0, 0, 0, .8); transition: opacity .35s, transform .35s; transform: translateY(8px);
  }
  #banner.on { opacity: 1; transform: none; }
  #banner small { display: block; font-size: .42em; font-style: normal; letter-spacing: .3em; color: var(--accent); }

  button {
    font: inherit; font-weight: 800; color: #1a0f04; background: var(--accent); border: 0;
    border-radius: 999px; padding: 12px 24px; cursor: pointer; pointer-events: auto; touch-action: manipulation;
  }
  button:active { transform: scale(.96); }
  button.ghost { color: #fff; background: rgba(6, 11, 20, .55); border: 1px solid rgba(143, 211, 255, .4); }
  button.small { padding: 6px 14px; font-size: 14px; font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

  /* Full-screen screens: the live 3D scene stays visible behind them */
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 14px; text-align: center; padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(6, 11, 20, .72) 0%, rgba(6, 11, 20, 0) 34%, rgba(6, 11, 20, 0) 48%, rgba(6, 11, 20, .9) 100%);
  }
  .screen h1 {
    position: absolute; top: calc(5vh + env(safe-area-inset-top)); left: 0; right: 0; margin: 0; padding: 0 12px;
    font-size: clamp(46px, 13vw, 150px); line-height: .9; font-weight: 900; font-style: italic;
    letter-spacing: -.02em; text-transform: uppercase; text-shadow: 0 6px 40px rgba(0, 0, 0, .6);
  }
  .screen h1 span { color: var(--accent); }
  .screen p { margin: 0; max-width: 34em; color: #d6e4f0; font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .label { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--ice); }
  .big { font-size: clamp(54px, 12vw, 110px); font-weight: 900; font-style: italic; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  #loading { justify-content: center; background: var(--ink); }
  #loading h1 { position: static; }
  #bar { width: min(320px, 70vw); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  #shareBox {
    width: min(420px, 90vw); font: inherit; font-size: 14px; color: #fff; background: rgba(6, 11, 20, .7);
    border: 1px solid var(--ice); border-radius: 12px; padding: 10px 12px; resize: none; pointer-events: auto;
    user-select: text; -webkit-user-select: text; touch-action: auto;
  }

  /* Car picker */
  .car {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; color: #fff; font-weight: 700; font-size: 14px;
    background: rgba(6, 11, 20, .55); border: 1px solid rgba(143, 211, 255, .3);
  }
  .car i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); }
  .car[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="pill hot">Score <b id="score">0</b></div>
  <div class="pill" id="timePill">Time <b id="time">2:00</b></div>
  <div class="pill" id="levelPill"><b id="level">Level 1</b></div>
  <div class="spacer"></div>
  <button class="ghost small" id="view">View: Chase</button>
  <button class="ghost small" id="finish" hidden>Finish</button>
</div>
<div id="speed" hidden><span id="kmh">0</span><small>KM/H</small></div>
<div id="banner"></div>

<section class="screen" id="loading">
  <h1 class="title"></h1>
  <div id="bar"><i></i></div>
  <p id="loadText">Loading the road…</p>
</section>

<section class="screen" id="start" hidden>
  <h1 class="title"></h1>
  <p id="tagline"></p>
  <div class="label">Choose your car</div>
  <div class="row" id="cars"></div>
  <div class="row">
    <button id="playRun">Timed Run</button>
    <button id="playFree" class="ghost">Free Drive</button>
  </div>
  <div class="label" id="best"></div>
  <p id="hint"></p>
</section>

<section class="screen" id="end" hidden>
  <div class="label" id="endLabel">Run complete</div>
  <div class="big" id="endScore">0</div>
  <p id="endText"></p>
  <div class="row">
    <button id="again">Play again</button>
    <button id="share" class="ghost">Share score</button>
    <button id="menu" class="ghost">Menu</button>
  </div>
  <p id="shareNote" role="status"></p>
  <textarea id="shareBox" rows="2" readonly hidden></textarea>
</section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
