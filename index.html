<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Frost Drift</title>
<link rel="icon" href="data:,">
<style>
  :root { --ice: #8fd3ff; --pine: #1f4d3a; --accent: #ff8a2b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1424; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center;
    padding: 12px 14px; pointer-events: none; font-weight: 700;
  }
  .pill {
    background: rgba(10, 22, 36, .55); border: 1px solid rgba(143, 211, 255, .35);
    border-radius: 999px; padding: 6px 14px; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .pill b { color: var(--accent); }
  .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 800; color: #1a0f04; background: var(--accent); border: 0;
    border-radius: 999px; padding: 10px 22px; cursor: pointer; pointer-events: auto;
  }
  button:active { transform: scale(.96); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill">Score <b id="score">0</b></div>
  <div class="spacer"></div>
  <button id="restart">Restart</button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
